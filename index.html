<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>휘 돌봄 캘린더</title><style>:root{color-scheme:dark;--bg:#0b0f14;--card:#151b23;--line:#2a3340;--muted:#8f9aa8;--accent:#7ec8ff;--care:#ffe29a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:14px}h1{margin:4px 0;font-size:26px}.sub{color:var(--muted);font-size:13px}.tabs,.buttons,.bottom{display:flex;gap:8px;margin:14px 0}button{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:11px 13px;font-size:14px;flex:1}.active{border-color:var(--accent);color:var(--accent)}.primary{background:#fff;color:#000;border-color:#fff}.legend{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.pill{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:#b7c0ca}.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}.head,.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.head{text-align:center;padding:7px;font-size:12px;background:#111720}.cell{height:104px;padding:6px;overflow:hidden}.empty{opacity:.25}.date{font-size:12px;color:#aab3be;cursor:pointer}.sun .date,.sat .date{color:#ff7b7b}.shift{font-size:22px;font-weight:700;margin-top:5px}.mine{font-size:10px;color:#8de1a8;margin-top:2px}.care{margin-top:5px;padding:5px;border-radius:8px;text-align:center;background:rgba(255,209,102,.12);color:var(--care);font-size:11px;line-height:1.15}.event{font-size:9px;color:#b8e2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.week{display:none}.week.show{display:block}.month.hide{display:none}.weekcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:10px}.row{display:grid;grid-template-columns:86px 45px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.row:last-child{border-bottom:0}.row .c{color:var(--care);font-weight:600}.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;align-items:flex-end;justify-content:center}.modalbg.show{display:flex}.modal{width:min(560px,100%);background:#141a22;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px;max-height:88vh;overflow:auto}.modal h2{margin:0 0 14px;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}input,select,textarea{width:100%;background:#0f141b;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}textarea{min-height:68px}.actions{display:flex;gap:8px;margin-top:14px}.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}@media(max-width:600px){.wrap{padding:10px}.cell{height:96px}.shift{font-size:20px}}</style></head><body><div class="wrap"><div class="sub">2026년 9월</div><h1>휘 돌봄 캘린더 👵</h1><div class="tabs"><button id="mb" class="active" onclick="view('m')">월간</button><button id="wb" onclick="view('w')">주간</button></div><div class="buttons"><button onclick="openSch()">＋ 근무/휴무 입력</button><button onclick="openEv()">＋ 변동일정</button></div><div class="legend"><span class="pill">휘 평일 09:00~17:00</span><span class="pill">토 10:30 발레</span><span class="pill">달력엔 돌봄 유형만 표시</span></div><section id="month" class="month"><div id="cal" class="cal"></div></section><section id="week" class="week"></section><div class="bottom"><button class="primary" onclick="copyMom()">엄마 일정 복사</button><button onclick="shareMom()">공유하기</button></div><div class="note">현재 입력내용은 이 브라우저에 저장돼요. 남편과 같은 데이터를 함께 수정하는 Google Sheet 연동은 다음 단계에서 연결할 수 있어요.</div></div><div id="schBg" class="modalbg" onclick="if(event.target===this)closeSch()"><div class="modal"><h2>근무 / 휴무 입력</h2><div class="grid"><div><label>날짜</label><input id="sd" type="date" value="2026-09-14"></div><div><label>오빠 근무</label><select id="sb"><option>주</option><option>야</option><option>비</option><option>휴</option></select></div><div class="full"><label>내 상태</label><select id="sm"><option>근무</option><option>휴무</option></select></div></div><div class="actions"><button onclick="closeSch()">취소</button><button class="primary" onclick="saveSch()">저장</button></div></div></div><div id="evBg" class="modalbg" onclick="if(event.target===this)closeEv()"><div class="modal"><h2>변동 일정 추가</h2><div class="grid"><div><label>날짜</label><input id="ed" type="date" value="2026-09-14"></div><div><label>사람</label><select id="ep"><option>나</option><option>오빠</option><option>휘</option></select></div><div><label>일정 종류</label><select id="et"><option>회의</option><option>교육</option><option>회식</option><option>병원</option><option>외출</option><option>기타</option></select></div><div><label>돌봄 유형</label><select id="ct"><option value="">없음/직접선택</option><option>하원</option><option>저녁</option><option>오전</option><option>종일</option></select></div><div><label>일정 시작</label><input id="es" type="time"></div><div><label>일정 종료</label><input id="ee" type="time"></div><div><label>돌봄 시작</label><input id="cs" type="time"></div><div><label>돌봄 종료</label><input id="ce" type="time"></div><div class="full"><label>메모</label><textarea id="em" placeholder="예: 오빠 교육으로 하원 필요"></textarea></div></div><div class="actions"><button onclick="closeEv()">취소</button><button class="primary" onclick="saveEv()">저장</button></div></div></div><script>const D={1:'휴',2:'야',3:'비',4:'휴',5:'주',6:'야',7:'비',8:'휴',9:'주',10:'야',11:'비',12:'휴',13:'주',14:'야',15:'비',16:'휴',17:'주',18:'야',19:'비',20:'휴',21:'주',22:'야',23:'비',24:'휴',25:'주',26:'야',27:'비',28:'휴',29:'주',30:'야'},OFF={14:1,23:1,30:1},WK=['일','월','화','수','목','금','토'],SK='hwi-sch-v2',EK='hwi-ev-v2';function sch(){let x={};try{x=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){};let r={};for(let d=1;d<=30;d++)r[d]={bro:D[d],me:OFF[d]?'휴무':'근무'};return Object.assign(r,x)}function evs(){try{return JSON.parse(localStorage.getItem(EK)||'[]')}catch(e){return[]}}function care(d,s){let w=new Date(2026,8,d).getDay();if(s.me==='휴무'||w===0)return null;if(w<6){if(s.bro==='주')return{t:'하원',a:'17:00',b:'19:00'};if(s.bro==='야')return{t:'저녁',a:'19:00',b:'22:00'}}else{if(s.bro==='주')return{t:'오전',a:'08:00',b:'18:00'};if(s.bro==='비')return{t:'오전',a:'08:00',b:'14:00'}}return null}function render(){let s=sch(),e=evs(),cal=document.getElementById('cal');cal.innerHTML=['일','월','화','수','목','금','토'].map(x=>`<div class="head">${x}</div>`).join('');let first=new Date(2026,8,1).getDay();for(let i=0;i<first;i++)cal.innerHTML+='<div class="cell empty"></div>';for(let d=1;d<=30;d++){let w=new Date(2026,8,d).getDay(),c=care(d,s[d]),events=e.filter(x=>x.date===`2026-09-${String(d).padStart(2,'0')}`);cal.innerHTML+=`<div class="cell ${w===0?'sun':w===6?'sat':''}"><div class="date" onclick="openSch(${d})">${d}</div><div class="shift">${s[d].bro}</div>${s[d].me==='휴무'?'<div class="mine">내 휴무</div>':''}${c?`<div class="care">👵<br>${c.t}</div>`:''}${events.map(x=>`<div class="event" onclick="delEv(${x.id})">${x.person} ${x.type}${x.ct?' · 👵 '+x.ct:''}</div>`).join('')}</div>`}renderWeek()}function renderWeek(){let s=sch(),e=evs(),out='';for(let st of [14,21,28]){out+=`<div class="weekcard"><div class="sub">9월 ${st}일 주</div>`;for(let d=st;d<=Math.min(st+6,30);d++){let c=care(d,s[d]),extra=e.filter(x=>x.date===`2026-09-${String(d).padStart(2,'0')}`&&x.ct&&x.cs&&x.ce);let txt=c?`👵 ${c.t} · ${c.a}~${c.b}`:'돌봄 없음';if(extra.length)txt+=' / '+extra.map(x=>`👵 ${x.ct} · ${x.cs}~${x.ce}`).join(', ');out+=`<div class="row"><strong>${d}일(${WK[new Date(2026,8,d).getDay()]})</strong><span>${s[d].bro}</span><span class="${txt==='돌봄 없음'?'':'c'}">${txt}</span></div>`}out+='</div>'}document.getElementById('week').innerHTML=out}function view(v){month.classList.toggle('hide',v==='w');week.classList.toggle('show',v==='w');mb.classList.toggle('active',v==='m');wb.classList.toggle('active',v==='w')}function openSch(d){if(d)sd.value=`2026-09-${String(d).padStart(2,'0')}`;let n=+sd.value.slice(-2),s=sch()[n];sb.value=s.bro;sm.value=s.me;schBg.classList.add('show')}function closeSch(){schBg.classList.remove('show')}function saveSch(){let d=+sd.value.slice(-2),x=sch();x[d]={bro:sb.value,me:sm.value};localStorage.setItem(SK,JSON.stringify(x));closeSch();render()}function openEv(){evBg.classList.add('show')}function closeEv(){evBg.classList.remove('show')}function saveEv(){let x=evs();x.push({id:Date.now(),date:ed.value,person:ep.value,type:et.value,start:es.value,end:ee.value,ct:ct.value,cs:cs.value,ce:ce.value,memo:em.value});localStorage.setItem(EK,JSON.stringify(x));closeEv();render()}function delEv(id){if(confirm('이 변동일정을 삭제할까?')){localStorage.setItem(EK,JSON.stringify(evs().filter(x=>x.id!==id)));render()}}function momText(){let s=sch(),e=evs(),a=[];for(let d=1;d<=30;d++){let c=care(d,s[d]);if(c)a.push({d,t:c.t,a:c.a,b:c.b})}e.filter(x=>x.ct&&x.cs&&x.ce).forEach(x=>a.push({d:+x.date.slice(-2),t:x.ct,a:x.cs,b:x.ce}));a.sort((x,y)=>x.d-y.d||x.a.localeCompare(y.a));return'엄마 9월 돌봄 일정\n\n'+a.map(x=>`9월 ${x.d}일(${WK[new Date(2026,8,x.d).getDay()]}) ${x.t} ${x.a}~${x.b}`).join('\n')}async function copyMom(){await navigator.clipboard.writeText(momText());alert('엄마에게 보낼 일정이 복사됐어요.')}async function shareMom(){if(navigator.share)try{await navigator.share({title:'휘 돌봄 일정',text:momText()})}catch(e){}else copyMom()}render();</script></body></html>
